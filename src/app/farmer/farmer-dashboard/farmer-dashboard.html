<div class="flex h-screen surface-ground overflow-hidden" style="font-family: 'Inter', 'Segoe UI', sans-serif;">
    <!-- Sidebar -->
    <aside class="flex flex-column flex-shrink-0 surface-card border-right-1 border-200"
        style="width: 272px; box-shadow: 2px 0 12px rgba(0,0,0,0.03);">

        <!-- Sidebar Header -->
        <div class="p-3 border-bottom-1 border-200">
            <div class="flex align-items-center gap-3">
                <div class="flex align-items-center justify-content-center border-round-xl"
                    style="width:40px; height:40px; background: linear-gradient(135deg, #22c55e, #16a34a);">
                    <i class="pi pi-home text-white" style="font-size: 18px;"></i>
                </div>
                <div>
                    <h1 class="m-0 text-lg font-bold text-900" style="letter-spacing: -0.3px;">KrishiYatra</h1>
                    <p class="m-0 mt-1 text-xs text-500 font-medium">Farmer Dashboard</p>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 overflow-y-auto p-3">
            <!-- Dashboard -->
            <a class="flex align-items-center gap-2 px-3 py-2 border-round-lg text-600 no-underline text-sm font-semibold mb-1 nav-item"
                routerLink="/farmer" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active-nav">
                <i class="pi pi-th-large" style="font-size: 16px;"></i>
                <span>Dashboard</span>
            </a>

            <!-- Stock Management Group -->
            <div class="mb-1" [class.expanded]="expandedGroup === 'stock'">
                <button
                    class="flex align-items-center justify-content-between w-full px-3 py-2 border-round-lg border-none bg-transparent text-700 text-sm font-semibold cursor-pointer nav-group-header"
                    (click)="toggleGroup('stock')">
                    <div class="flex align-items-center gap-2">
                        <div class="flex align-items-center justify-content-center border-round-lg bg-green-50 text-green-600"
                            style="width:32px; height:32px;">
                            <i class="pi pi-box" style="font-size: 14px;"></i>
                        </div>
                        <span>Stock Management</span>
                    </div>
                    <i class="pi pi-chevron-down text-400 group-arrow"
                        [style.transform]="expandedGroup === 'stock' ? 'rotate(180deg)' : 'none'"
                        style="font-size: 10px; transition: transform 0.25s ease;"></i>
                </button>
                <div class="pl-4 nav-group-items" [style.max-height]="expandedGroup === 'stock' ? '200px' : '0'"
                    style="overflow: hidden; transition: max-height 0.25s ease;">
                    <a class="flex align-items-center gap-2 px-3 py-2 border-round-md text-600 no-underline text-xs font-medium my-1 nav-sub-item"
                        routerLink="/farmer/stocks/my-stocks" routerLinkActive="active-nav">
                        <i class="pi pi-list" style="font-size: 12px;"></i>
                        <span>My Stocks</span>
                    </a>
                    <a class="flex align-items-center gap-2 px-3 py-2 border-round-md text-600 no-underline text-xs font-medium my-1 nav-sub-item"
                        routerLink="/farmer/stocks/create" routerLinkActive="active-nav">
                        <i class="pi pi-plus" style="font-size: 12px;"></i>
                        <span>Add Stock</span>
                    </a>
                </div>
            </div>

            <!-- Order Management Group -->
            <div class="mb-1" [class.expanded]="expandedGroup === 'order'">
                <button
                    class="flex align-items-center justify-content-between w-full px-3 py-2 border-round-lg border-none bg-transparent text-700 text-sm font-semibold cursor-pointer nav-group-header"
                    (click)="toggleGroup('order')">
                    <div class="flex align-items-center gap-2">
                        <div class="flex align-items-center justify-content-center border-round-lg bg-blue-50 text-blue-600"
                            style="width:32px; height:32px;">
                            <i class="pi pi-shopping-bag" style="font-size: 14px;"></i>
                        </div>
                        <span>Order Management</span>
                    </div>
                    <i class="pi pi-chevron-down text-400 group-arrow"
                        [style.transform]="expandedGroup === 'order' ? 'rotate(180deg)' : 'none'"
                        style="font-size: 10px; transition: transform 0.25s ease;"></i>
                </button>
                <div class="pl-4 nav-group-items" [style.max-height]="expandedGroup === 'order' ? '200px' : '0'"
                    style="overflow: hidden; transition: max-height 0.25s ease;">
                    <a class="flex align-items-center gap-2 px-3 py-2 border-round-md text-600 no-underline text-xs font-medium my-1 nav-sub-item"
                        routerLink="/farmer/orders/my-orders" routerLinkActive="active-nav">
                        <i class="pi pi-list" style="font-size: 12px;"></i>
                        <span>My Orders</span>
                    </a>
                </div>
            </div>

            <!-- Market Demands Group -->
            <div class="mb-1" [class.expanded]="expandedGroup === 'demand'">
                <button
                    class="flex align-items-center justify-content-between w-full px-3 py-2 border-round-lg border-none bg-transparent text-700 text-sm font-semibold cursor-pointer nav-group-header"
                    (click)="toggleGroup('demand')">
                    <div class="flex align-items-center gap-2">
                        <div class="flex align-items-center justify-content-center border-round-lg bg-orange-50 text-orange-600"
                            style="width:32px; height:32px;">
                            <i class="pi pi-megaphone" style="font-size: 14px;"></i>
                        </div>
                        <span>Market Requests</span>
                    </div>
                    <i class="pi pi-chevron-down text-400 group-arrow"
                        [style.transform]="expandedGroup === 'demand' ? 'rotate(180deg)' : 'none'"
                        style="font-size: 10px; transition: transform 0.25s ease;"></i>
                </button>
                <div class="pl-4 nav-group-items" [style.max-height]="expandedGroup === 'demand' ? '200px' : '0'"
                    style="overflow: hidden; transition: max-height 0.25s ease;">
                    <a class="flex align-items-center gap-2 px-3 py-2 border-round-md text-600 no-underline text-xs font-medium my-1 nav-sub-item"
                        routerLink="/farmer/demands" routerLinkActive="active-nav">
                        <i class="pi pi-search-plus" style="font-size: 12px;"></i>
                        <span>Manage Market Requests</span>
                    </a>
                </div>
            </div>
        </nav>

        <!-- Sidebar Footer -->
        <div class="p-3 border-top-1 border-200">
            <button (click)="goToProfile()" 
               class="flex align-items-center justify-content-center gap-2 w-full px-3 py-2 border-round-xl border-1 border-300 bg-white text-700 hover:surface-100 no-underline text-sm font-semibold transition-all transition-duration-200 cursor-pointer"
               style="height: 44px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); outline: none;">
                <i class="pi pi-user" style="font-size: 14px;"></i>
                <span>Back to Profile</span>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 md:p-5 surface-ground">
        <router-outlet></router-outlet>

        @if (isDefaultRoute) {
        <div class="fadein animation-duration-300">
            <!-- Basic Data / Stats -->
            <div class="grid">
                <div class="col-12 md:col-6 lg:col-3">
                    <div class="surface-card border-1 border-200 border-round-xl p-4 flex align-items-center justify-content-between">
                        <div class="flex flex-column gap-1">
                            <span class="text-xs text-500 font-medium uppercase tracking-wider">Total Stocks</span>
                            <span class="text-3xl font-bold text-900" style="letter-spacing: -0.5px;">{{ totalStocks }}</span>
                        </div>
                        <div class="flex align-items-center justify-content-center border-round-xl bg-green-50 text-green-600" style="width:48px; height:48px;">
                            <i class="pi pi-box" style="font-size: 20px;"></i>
                        </div>
                    </div>
                </div>
                <div class="col-12 md:col-6 lg:col-3">
                    <div class="surface-card border-1 border-200 border-round-xl p-4 flex align-items-center justify-content-between">
                        <div class="flex flex-column gap-1">
                            <span class="text-xs text-500 font-medium uppercase tracking-wider">Total Orders</span>
                            <span class="text-3xl font-bold text-900" style="letter-spacing: -0.5px;">{{ totalOrders }}</span>
                        </div>
                        <div class="flex align-items-center justify-content-center border-round-xl bg-blue-50 text-blue-600" style="width:48px; height:48px;">
                            <i class="pi pi-shopping-bag" style="font-size: 20px;"></i>
                        </div>
                    </div>
                </div>
                <!-- Future Visualization Placeholder -->
                <div class="col-12">
                   <div class="surface-card border-1 border-200 border-round-xl p-8 flex flex-column align-items-center justify-content-center text-500 bg-gray-50 border-dashed">
                       <i class="pi pi-chart-bar text-4xl mb-3"></i>
                       <p class="m-0 font-medium">Visualization Analytics Coming Soon</p>
                   </div>
                </div>
            </div>
        </div>
        }
    </main>
</div>
