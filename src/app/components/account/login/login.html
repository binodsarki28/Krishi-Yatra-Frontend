<div class="login-page">
    <div class="login-wrapper">
        <div class="login-card">
            <!-- Left Panel - Modern Green Gradient -->
            <div class="left-panel">
                <div class="panel-content">
                    <div class="logo-section">
                        <i class="pi pi-compass"></i>
                    </div>
                    <h1 class="welcome-title">Welcome to</h1>
                    <h2 class="brand-name">KrishiYatra</h2>
                    <p class="tagline">Empowering farmers through technology and community</p>
                    <div class="decorative-circles">
                        <div class="circle circle-1"></div>
                        <div class="circle circle-2"></div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Login Form -->
            <div class="right-panel">
                <div class="form-container">
                    <div class="form-header">
                        <h2>Sign In</h2>
                        <p>Don't have an account? <a routerLink="/account/register" class="link-primary">Create one</a>
                        </p>
                    </div>

                    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                        <div class="form-group">
                            <label for="username">Email or Username</label>
                            <input id="username" type="text" pInputText formControlName="username"
                                placeholder="Enter your email or username">
                            <small class="error-message"
                                *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                                Username is required
                            </small>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <p-password id="password" [toggleMask]="true" [feedback]="false" formControlName="password"
                                placeholder="Enter your password" styleClass="w-full"></p-password>
                            <small class="error-message"
                                *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                                Password is required
                            </small>
                        </div>

                        <div class="form-options">
                            <div class="checkbox-wrapper">
                                <p-checkbox id="remember" [binary]="true" formControlName="rememberMe"></p-checkbox>
                                <label for="remember">Remember me</label>
                            </div>
                            <a class="link-secondary">Forgot password?</a>
                        </div>

                        <p-button label="Sign In" [loading]="loading" type="submit" styleClass="submit-btn"></p-button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
