<div class="p-5 flex justify-content-center">
    <p-card header="Profile" subheader="Welcome, {{ user.name }}" [style]="{ width: '360px' }" class="shadow-4">
        <ng-template pTemplate="header">
            <div class="flex justify-content-center pt-4">
                <i class="pi pi-user-edit text-6xl text-primary"></i>
            </div>
        </ng-template>

        <p class="m-0 text-lg">
            <strong>Email:</strong> {{ user.email }}<br>
            <strong>Role:</strong> <span class="text-green-600 font-bold">{{ user.role }}</span>
        </p>

        <ng-template pTemplate="footer">
            <div class="flex justify-content-end gap-2 mt-3">
                <p-button label="Logout" icon="pi pi-sign-out" severity="danger" (onClick)="logout()"></p-button>
            </div>
        </ng-template>
    </p-card>
</div>
