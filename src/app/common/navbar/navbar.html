```html
<div class="layout-topbar shadow-3 w-full p-0 m-0 fixed top-0 left-0 z-5 bg-white"
    style="background-color: white !important; z-index: 1000;">
    <p-menubar [model]="items" class="border-none border-noround w-full h-5rem px-4 py-2 surface-overlay">
        <ng-template pTemplate="start">
            <div class="flex align-items-center cursor-pointer gap-2" (click)="navigateToHome()">
                <i class="pi pi-compass text-5xl text-green-600"></i>
                <span class="text-4xl font-bold text-900 line-height-1">Krishi<span
                        class="text-green-600">Yatra</span></span>
            </div>
        </ng-template>

        <ng-template pTemplate="end">
            <div class="flex align-items-center gap-4">
                @if (isLoggedIn) {
                 <button pButton pRipple icon="pi pi-bell"
                    class="p-button-rounded p-button-text p-button-plain text-xl"
                    style="color: #64748b;"></button>
                <button pButton pRipple label="Profile" icon="pi pi-user"
                    class="p-button-success font-bold border-round-3xl px-4 py-2 shadow-2 transition-transform hover-scale text-sm"
                    (click)="navigateToProfile()"></button>
                } @else {
                <button pButton pRipple label="Sign In" icon="pi pi-user"
                    class="p-button-text p-button-plain font-bold px-3 py-2 text-sm"
                    (click)="navigateToLogin()"></button>
                <button pButton pRipple label="Join Now" icon="pi pi-arrow-right"
                    class="p-button-success font-bold border-round-3xl px-4 py-2 shadow-3 transition-transform hover-scale text-sm"
                    (click)="navigateToRegister()"></button>
                }
            </div>
        </ng-template>
    </p-menubar>
</div>
