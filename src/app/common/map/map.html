<div class="map-container-wrapper relative w-full border-round-xl overflow-hidden shadow-2 bg-white">
    <!-- Map Header -->
    <div class="map-header flex justify-content-between align-items-center p-3 border-bottom-1 border-100">
        <div class="flex align-items-center gap-2">
            <i class="pi pi-map text-primary"></i>
            <span class="font-bold text-700">Delivery Route Visualization</span>
        </div>
        <div class="flex gap-2">
            <button *ngIf="drawRoute" pButton icon="pi pi-directions" 
                    class="p-button-text p-button-sm p-button-secondary border-1 border-200" 
                    pTooltip="Toggle Step-by-Step Directions"
                    (click)="toggleDirections()">
            </button>
            <button pButton icon="pi pi-compass" 
                    class="p-button-text p-button-sm p-button-secondary border-1 border-200" 
                    pTooltip="Re-center View"
                    (click)="fitBounds()">
            </button>
            <button *ngIf="drawRoute && pickupLocation && dropLocation" pButton icon="pi pi-refresh" 
                    label="Redraw Route"
                    class="p-button-sm p-button-info shadow-2 ml-2" 
                    pTooltip="Click if route line didn't appear"
                    (click)="redrawRoute()">
            </button>
        </div>
    </div>

    <!-- Map View -->
    <div class="relative">
        <div [id]="mapId" class="leaflet-map w-full" style="height: 400px; min-height: 300px;"></div>
        
        <!-- Legend Overlay (Bottom Left) -->
        <div class="absolute bottom-0 left-0 m-3 z-1000 bg-white-alpha-90 p-2 border-round shadow-2 pointer-events-none">
            <div class="flex align-items-center gap-2 mb-1">
                <div class="w-2 h-2 border-circle bg-green-500"></div>
                <span class="text-xs font-bold text-700">PICKUP</span>
            </div>
            <div class="flex align-items-center gap-2">
                <div class="w-2 h-2 border-circle bg-red-500"></div>
                <span class="text-xs font-bold text-700">DROP</span>
            </div>
        </div>

        <!-- Distance Badge Overlay (Top Right) -->
        <div *ngIf="distanceInfo" class="distance-badge-overlay absolute top-0 right-0 m-3 z-1000">
            <p-tag [value]="distanceInfo" severity="info" class="shadow-4"></p-tag>
        </div>

        <!-- Float Search (Picker Mode Only) -->
        <div *ngIf="pickerMode" class="absolute top-0 left-0 m-3 z-1000 w-8 sm:w-6 lg:w-4">
            <div class="p-inputgroup shadow-4 border-round overflow-hidden bg-white">
                <input #searchInput type="text" pInputText placeholder="Search location in Nepal..." 
                       (keyup.enter)="searchLocation(searchInput.value)"
                       class="p-inputtext-sm border-none w-full p-2">
                <button pButton icon="pi pi-search" (click)="searchLocation(searchInput.value)" 
                        class="p-button-success p-button-sm border-none px-3"></button>
            </div>
        </div>
    </div>

    <!-- Interactive Checkpoints Section (Below Map) -->
    <div *ngIf="drawRoute" class="p-3 bg-white border-top-1 border-100 anim-fade-in">
        <div class="flex align-items-center gap-2 mb-3">
            <i class="pi pi-flag text-primary font-bold"></i>
            <span class="text-sm font-bold text-700 uppercase tracking-tight">Timeline & Checkpoints</span>
        </div>

        <div class="route-timeline flex flex-column gap-3 pl-2">
            <!-- Pickup -->
            <div class="flex gap-3">
                <div class="flex flex-column align-items-center">
                    <div class="w-1rem h-1rem border-circle bg-green-500 shadow-2 flex align-items-center justify-content-center">
                        <i class="pi pi-home text-[8px] text-white"></i>
                    </div>
                    <div class="w-2px h-full bg-200 mt-1"></div>
                </div>
                <div class="flex flex-column pb-2">
                    <span class="text-xs text-500 font-bold">START: PICKUP</span>
                    <span class="text-sm font-medium text-700">{{ pickupLocation?.label || 'Farmer Address' }}</span>
                </div>
            </div>

            <!-- START/END ONLY -->
            <div class="flex gap-3 mb-4">
                <div class="flex flex-column align-items-center">
                    <div class="w-1rem h-1rem border-circle bg-red-500 shadow-2 flex align-items-center justify-content-center">
                        <i class="pi pi-user text-[8px] text-white"></i>
                    </div>
                </div>
                <div class="flex flex-column">
                    <span class="text-xs text-500 font-bold">END: DROP-OFF</span>
                    <span class="text-sm font-medium text-700">{{ dropLocation?.label || 'Your Address' }}</span>
                </div>
            </div>
        </div>
    </div>
</div>
