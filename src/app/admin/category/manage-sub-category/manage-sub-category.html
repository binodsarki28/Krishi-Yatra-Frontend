<div class="fadein animation-duration-300">
    <!-- Header -->
    <div class="mb-4">
        <h2 class="text-2xl font-bold text-900 m-0">Sub-Category Management</h2>
        <p class="text-500 mt-1 mb-0">Manage sub-categories linked to your main categories</p>
    </div>

    <div class="grid">
        <!-- Add SubCategory Form -->
        <div class="col-12 md:col-4">
            <div class="surface-card p-4 border-round-xl border-1 border-200">
                <h5 class="text-lg font-bold mb-3 mt-0 text-900"><i class="pi pi-tags text-blue-500 mr-2"></i>Add New Sub-Category</h5>
                <div class="flex flex-column gap-3">
                    <div class="flex flex-column gap-1">
                        <label for="subCatParent" class="text-sm font-medium text-700">Parent Category</label>
                        <p-select id="subCatParent" [options]="categories" [(ngModel)]="selectedCategoryForSub" optionLabel="categoryName" placeholder="Select a Category" styleClass="w-full"></p-select>
                    </div>
                    <div class="flex flex-column gap-1">
                        <label for="subCatName" class="text-sm font-medium text-700">Sub-Category Name</label>
                        <input id="subCatName" type="text" pInputText [(ngModel)]="newSubCategoryName" placeholder="e.g. Tomato">
                    </div>
                    <p-button label="Create Sub-Category" icon="pi pi-check" 
                        [loading]="isAddingSubCategory" (onClick)="createSubCategory()" 
                        [disabled]="!newSubCategoryName || !selectedCategoryForSub" styleClass="w-full mt-1 p-button-info"></p-button>
                </div>
            </div>
        </div>

        <!-- SubCategories Table -->
        <div class="col-12 md:col-8">
            <div class="surface-card p-4 border-round-xl border-1 border-200 h-full">
                <div class="flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                    <h5 class="text-lg font-bold m-0 text-900">Sub-Categories List</h5>
                    <div class="flex flex-wrap align-items-center gap-2 w-full md:w-auto">
                        <p-select [options]="categories" optionLabel="categoryName" optionValue="categoryName" (onChange)="dt.filter($event.value, 'categoryName', 'equals')" placeholder="Category" [showClear]="true" styleClass="p-inputtext-sm w-full md:w-14rem"></p-select>
                        <span class="p-input-icon-left flex-1 md:flex-none">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Search names..." class="p-inputtext-sm w-full md:w-16rem" />
                        </span>
                        <p-button icon="pi pi-refresh" [text]="true" [rounded]="true" (onClick)="loadSubCategories()"></p-button>
                    </div>
                </div>
                <p-table #dt [value]="subCategories" [globalFilterFields]="['subCategoryName', 'categoryName']" [paginator]="true" [rows]="10" styleClass="p-datatable-sm p-datatable-striped" responsiveLayout="scroll">
                    <ng-template pTemplate="header">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th class="text-right">Action</th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-sub>
                        <tr>
                            <td><span class="text-500 font-medium">#{{sub.subCategoryId}}</span></td>
                            <td class="font-semibold">{{sub.subCategoryName}}</td>
                            <td><span class="text-600 bg-gray-100 px-2 py-1 border-round text-xs font-semibold">{{sub.categoryName || 'Unknown'}}</span></td>
                            <td>
                                <p-tag [severity]="sub.active ? 'success' : 'danger'" [value]="sub.active ? 'Active' : 'Inactive'"></p-tag>
                            </td>
                            <td class="text-right">
                                <p-button icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true" (onClick)="deleteSubCategory(sub.subCategoryId)"></p-button>
                            </td>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="emptymessage">
                        <tr><td colspan="5" class="text-center p-4 text-500">No sub-categories found.</td></tr>
                    </ng-template>
                </p-table>
            </div>
        </div>
    </div>
</div>

<p-toast></p-toast>
<p-confirmDialog [style]="{width: '450px'}" acceptButtonStyleClass="p-button-danger" rejectButtonStyleClass="p-button-text"></p-confirmDialog>
